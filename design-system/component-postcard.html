<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OurTrip · כותרת גלויה</title><style>
:root{
  --paper:#fbf7ef; --paper-deep:#f3ead9; --ink:#22312e; --ink-soft:#6b756e;
  --sea:#0e7c6b; --sea-deep:#0b5f54; --sea-tint:#e3efeb;
  --sun:#d9931e; --sun-tint:#fbedcf; --line:#ece3d3; --rose:#e11d48;
  --radius:1.5rem; --shadow:0 1px 2px rgba(34,49,46,.05),0 10px 26px -14px rgba(34,49,46,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:'Heebo','Assistant',system-ui,'Segoe UI',sans-serif;padding:24px;line-height:1.5}
h1,h2,h3{margin:0}
.kicker{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--sun);text-transform:none}
.card{border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px;max-width:440px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:1rem;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn-sea{background:var(--sea);color:#fff}
.btn-ghost{background:#fff;color:var(--sea);border:1px solid rgba(14,124,107,.3)}
.btn-sun{background:var(--sun);color:#3a2a06}
.btn-sos{background:var(--rose);color:#fff;border-radius:1rem}
.muted{color:var(--ink-soft)}
.label{font-size:.72rem;color:var(--ink-soft);margin-top:6px}
</style></head>
<body><div class="stack">
     <div class="kicker">SIGNATURE</div>
     <div style="position:relative;overflow:hidden;border-radius:var(--radius);
          background:linear-gradient(135deg,var(--sea),var(--sea-deep));color:#fff;
          box-shadow:var(--shadow);padding:22px;display:flex;justify-content:space-between;gap:12px">
       <div style="position:relative;z-index:1">
         <div style="font-size:.7rem;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.7)">היום</div>
         <div style="font-weight:600;color:rgba(255,255,255,.9);margin-top:4px">יום ראשון, 19.07.2026</div>
         <div style="font-size:1.5rem;font-weight:800;margin-top:8px">📍 ליסבון, פורטוגל</div>
       </div>
       <div style="position:relative;z-index:1;align-self:flex-start;background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.3);border-radius:1rem;padding:8px 12px;font-weight:700">🆘 חירום</div>
       <div style="position:absolute;inset-block-start:-40%;inset-inline-start:-10%;width:70%;height:160%;
            border-radius:9999px;border:2px dashed rgba(255,255,255,.16)"></div>
     </div>
     <p class="muted">האלמנט החתימתי: פס גלויה עם קשת־מסלול מקווקוות ברקע.</p>
   </div></body></html>
