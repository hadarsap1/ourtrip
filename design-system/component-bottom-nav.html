<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OurTrip · ניווט תחתון</title><style>
:root{
  --paper:#fbf7ef; --paper-deep:#f3ead9; --ink:#22312e; --ink-soft:#6b756e;
  --sea:#0e7c6b; --sea-deep:#0b5f54; --sea-tint:#e3efeb;
  --sun:#d9931e; --sun-tint:#fbedcf; --line:#ece3d3; --rose:#e11d48;
  --radius:1.5rem; --shadow:0 1px 2px rgba(34,49,46,.05),0 10px 26px -14px rgba(34,49,46,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:'Heebo','Assistant',system-ui,'Segoe UI',sans-serif;padding:24px;line-height:1.5}
h1,h2,h3{margin:0}
.kicker{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--sun);text-transform:none}
.card{border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px;max-width:440px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:1rem;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn-sea{background:var(--sea);color:#fff}
.btn-ghost{background:#fff;color:var(--sea);border:1px solid rgba(14,124,107,.3)}
.btn-sun{background:var(--sun);color:#3a2a06}
.btn-sos{background:var(--rose);color:#fff;border-radius:1rem}
.muted{color:var(--ink-soft)}
.label{font-size:.72rem;color:var(--ink-soft);margin-top:6px}
</style></head>
<body><div class="stack">
     <div class="kicker">COMPONENTS</div><h2 style="font-size:1.3rem">ניווט תחתון</h2>
     <div class="card" style="display:flex;padding:8px 4px">
       <div style="flex:1;text-align:center">
     <div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;border-radius:1rem;font-size:.72rem;
        background:var(--sun-tint);color:var(--sea-deep);font-weight:700">
       <span style="font-size:1.4rem">🏠</span>היום</div>
   </div><div style="flex:1;text-align:center">
     <div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;border-radius:1rem;font-size:.72rem;
        color:var(--ink-soft)">
       <span style="font-size:1.4rem">🧭</span>מסלול</div>
   </div><div style="flex:1;text-align:center">
     <div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;border-radius:1rem;font-size:.72rem;
        color:var(--ink-soft)">
       <span style="font-size:1.4rem">💵</span>תקציב</div>
   </div><div style="flex:1;text-align:center">
     <div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;border-radius:1rem;font-size:.72rem;
        color:var(--ink-soft)">
       <span style="font-size:1.4rem">📄</span>מסמכים</div>
   </div><div style="flex:1;text-align:center">
     <div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;border-radius:1rem;font-size:.72rem;
        color:var(--ink-soft)">
       <span style="font-size:1.4rem">⋯</span>עוד</div>
   </div>
     </div>
     <p class="muted">הלשונית הפעילה יושבת בכדור "שמש" רך.</p>
   </div></body></html>
