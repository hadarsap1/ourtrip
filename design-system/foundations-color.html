<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OurTrip · צבעים</title><style>
:root{
  --paper:#fbf7ef; --paper-deep:#f3ead9; --ink:#22312e; --ink-soft:#6b756e;
  --sea:#0e7c6b; --sea-deep:#0b5f54; --sea-tint:#e3efeb;
  --sun:#d9931e; --sun-tint:#fbedcf; --line:#ece3d3; --rose:#e11d48;
  --radius:1.5rem; --shadow:0 1px 2px rgba(34,49,46,.05),0 10px 26px -14px rgba(34,49,46,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:'Heebo','Assistant',system-ui,'Segoe UI',sans-serif;padding:24px;line-height:1.5}
h1,h2,h3{margin:0}
.kicker{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--sun);text-transform:none}
.card{border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px;max-width:440px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:1rem;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn-sea{background:var(--sea);color:#fff}
.btn-ghost{background:#fff;color:var(--sea);border:1px solid rgba(14,124,107,.3)}
.btn-sun{background:var(--sun);color:#3a2a06}
.btn-sos{background:var(--rose);color:#fff;border-radius:1rem}
.muted{color:var(--ink-soft)}
.label{font-size:.72rem;color:var(--ink-soft);margin-top:6px}
</style></head>
<body><div class="stack">
     <div><div class="kicker">FOUNDATIONS</div><h1 style="font-size:1.6rem">פלטת "נייר · ים · שמש"</h1>
       <p class="muted">רקע נייר חמים, ים טורקיז כצבע מותג, שמש כהדגשה במשורה.</p></div>
     <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
       <div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#fbf7ef;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">נייר</div>
     <div class="label" dir="ltr">#fbf7ef</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#f3ead9;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">נייר עמוק</div>
     <div class="label" dir="ltr">#f3ead9</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#ece3d3;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">קו</div>
     <div class="label" dir="ltr">#ece3d3</div>
   </div>
       <div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#0e7c6b;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">ים</div>
     <div class="label" dir="ltr">#0e7c6b</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#0b5f54;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">ים עמוק</div>
     <div class="label" dir="ltr">#0b5f54</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#e3efeb;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">ים בהיר</div>
     <div class="label" dir="ltr">#e3efeb</div>
   </div>
       <div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#d9931e;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">שמש</div>
     <div class="label" dir="ltr">#d9931e</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#fbedcf;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">שמש בהיר</div>
     <div class="label" dir="ltr">#fbedcf</div>
   </div><div style="text-align:center">
     <div style="height:64px;border-radius:14px;background:#22312e;border:1px solid rgba(0,0,0,.06)"></div>
     <div style="font-weight:600;margin-top:6px">דיו</div>
     <div class="label" dir="ltr">#22312e</div>
   </div>
     </div>
   </div></body></html>
